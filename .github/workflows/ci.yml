# Tests and lint on every branch push and pull request (tags are built by release.yml).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew test lint

      - name: Script tests
        run: |
          for t in scripts/test_*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */build/reports/
            buildSrc/build/reports/
